name: 'Deploy GitHub Pages'

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装项目依赖
        run: npm ci

      - name: 编译构建 Web 生产静态包 (dist 目录)
        run: npm run build

      - name: 配置 GitHub Pages 环境
        uses: actions/configure-pages@v5

      - name: 上传 dist 产物至 Pages 构件池
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 部署发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
